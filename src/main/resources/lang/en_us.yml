# =====================================================
#                    LifeHeartsPro
#              English Language - United States
# =====================================================
#
# Locale file: en_us.yml
# Default language for LifeHeartsPro.
#
# You can use & color codes in all messages.
# Placeholders like %player%, %amount%, %lives%, %team%,
# %mode%, %name%, %version% and %current% are replaced
# automatically by the plugin.
#
# =====================================================

prefix: "&b&lLifeHeartsPro &8» "


# =====================================================
# GENERAL MESSAGES
# =====================================================

reload: "&aPlugin reloaded."
no-permission: "&cYou do not have permission."
player-not-found: "&cPlayer not found."
invalid-number: "&cPlease enter a valid number."
players-only: "&cOnly players can use this command."


# =====================================================
# COMMAND USAGE
# =====================================================

lifehearts-usage: "&7Usage: &f/lifeheartspro <reload|revive|lives|actionbar|heartmode|team>"
heart-usage: "&7Usage: &f/heart give <player> <amount>"
team-usage: "&7Usage: &f/team <create|invite|accept|leave|kick|disband|info|list>"
lives-admin-usage: "&cUsage: /lifeheartspro lives <set|add|remove> <player> <amount>"
lives-action-usage: "&cUsage: /lifeheartspro lives <set|add|remove>"
actionbar-usage: "&cUsage: /lifeheartspro actionbar <on|off>"
heartmode-usage: "&7Usage: &f/lifeheartspro heartmode <display|heart>"
heartmode-invalid: "&cUsage: /lifeheartspro heartmode <display|heart>"
team-admin-usage: "&7Usage: &f/lifeheartspro team <glowing|tp|setspawn|admin> ..."
team-glowing-usage: "&7Usage: &f/lifeheartspro team glowing <team> <color|off>"
team-admin-action-usage: "&7Usage: &f/lifeheartspro team admin <invite|kick|disband> ..."
team-admin-invite-usage: "&7Usage: &f/lifeheartspro team admin invite <player> <team>"
team-admin-kick-usage: "&7Usage: &f/lifeheartspro team admin kick <player> <team>"
team-admin-disband-usage: "&7Usage: &f/lifeheartspro team admin disband <team>"


# =====================================================
# ADMIN HELP
# =====================================================

help-title: "&b&lAdmin Commands"
help-reload: "&7/lifeheartspro reload &8- Reload the plugin"
help-revive: "&7/lifeheartspro revive <player> &8- Revive and unban a player"
help-lives-set: "&7/lifeheartspro lives set <player> <amount>"
help-lives-add: "&7/lifeheartspro lives add <player> <amount>"
help-lives-remove: "&7/lifeheartspro lives remove <player> <amount>"
help-actionbar: "&7/lifeheartspro actionbar <on|off>"
help-heartmode: "&7/lifeheartspro heartmode <display|heart>"
help-team-glowing: "&7/lifeheartspro team glowing <team> <color|off>"
help-team-tp: "&7/lifeheartspro team tp <team>"
help-team-setspawn: "&7/lifeheartspro team setspawn <team>"
help-team-admin: "&7/lifeheartspro team admin <invite|kick|disband> &8- Direct team management"


# =====================================================
# HEART TRANSFER
# =====================================================

heart-given: "&aYou gave &f%amount% &aheart(s) to &f%player%&a."
heart-received: "&aYou received &f%amount% &aheart(s) from &f%player%&a."
heart-transfer-failed: "&cHeart transfer failed."
not-enough-lives: "&cYou do not have enough lives."


