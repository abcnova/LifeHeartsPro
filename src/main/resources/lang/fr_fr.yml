# Tu peux utiliser les codes couleur avec & dans tous les messages.
# Les placeholders comme %player%, %amount%, %lives%,
# %team%, %mode%, %name%, %version% et %current% sont
# remplaces automatiquement par le plugin.
#
# =====================================================

