# =====================================================
#                    LifeHeartsPro
#                   Message Sounds
# =====================================================
#
# This file controls the small sounds players hear when
# LifeHeartsPro sends normal chat/status messages.
#
# Every message sound can be changed or disabled.
#
# enabled:
# true  = play a sound for this message
# false = do not play a sound for this message
#
# sound:
# Use Bukkit/Paper sound names such as:
# ENTITY_EXPERIENCE_ORB_PICKUP
# BLOCK_NOTE_BLOCK_PLING
# BLOCK_NOTE_BLOCK_BASS
# ENTITY_VILLAGER_NO
# ENTITY_PLAYER_LEVELUP
# BLOCK_AMETHYST_BLOCK_CHIME
#
# volume:
# Keep this low for clean UI feedback.
# Recommended range: 0.25 - 0.70
#
# pitch:
# Higher pitch feels lighter/happier.
# Lower pitch feels heavier/error-like.
#
# =====================================================

sounds:

  # Master switch for all LifeHeartsPro message sounds.
  enabled: true

  messages:

    # =================================================
    # GENERAL MESSAGES
    # =================================================

    reload:
      enabled: true
